name: Task
description: One unit of implementation — one commit, one proof
labels: ["type:task"]
body:
  - type: input
    id: provenance
    attributes:
      label: Where this comes from
      placeholder: plan of #412 · RFC #950
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What
      description: One sentence. If it takes a paragraph, it is more than one task.
    validations: { required: true }
  - type: input
    id: acceptance-command
    attributes:
      label: Acceptance command (runnable)
      description: The command that proves this task is done. It must be executable as written.
      placeholder: "pnpm test src/tools/search-hotels.test.ts"
    validations: { required: true }
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: "AC-01 — …"
    validations: { required: true }
  - type: input
    id: depends-on
    attributes:
      label: Depends on
  - type: textarea
    id: avoid
    attributes:
      label: Avoid
      description: The prohibition specific to this task — what a reasonable implementation might do and must not.
      placeholder: "❌ No second silent cap downstream"
