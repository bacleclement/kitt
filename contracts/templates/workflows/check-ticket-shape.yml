name: Check ticket shape

# Generated by Kitt (/sync-ticket-templates) from contracts/ticket-shape.md.
# Do not hand-edit — change the contract and regenerate.
#
# Issue templates guide; they do not constrain. `gh issue create --body "..."`
# bypasses them entirely, which is exactly how an agent creates a ticket.
# This workflow is the gate that applies to every producer.
#
# It never closes or edits an issue. It labels and explains.

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED = {
              'type:epic':     ['Where this comes from', 'Why', 'Stories', 'Out of scope'],
              'type:feature':  ['Where this comes from', 'Today / After', 'Acceptance criteria', 'Out of scope'],
              'type:task':     ['Where this comes from', 'What', 'Acceptance command', 'Acceptance criteria'],
              'kind:bug':      ['Where this comes from', 'Symptom', 'Evidence', 'Reproduction', 'Cause category'],
              'kind:refactor': ['Where this comes from', 'Today', 'After', 'Boundaries', 'Acceptance command', 'Non-goals'],
            };
            const LABEL = 'needs-detail';

            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const type = labels.find(l => REQUIRED[l]);

            // No typed label: nothing to check. Untyped tickets are a triage
            // problem, not a shape problem — do not spam them.
            if (!type) return;

            const body = issue.body || '';
            // An issue form renders each field as "### <label>" followed by its value.
            const sections = {};
            let current = null;
            for (const line of body.split('\n')) {
              const h = line.match(/^#{1,4}\s+(.+?)\s*$/);
              if (h) { current = h[1]; sections[current] = ''; continue; }
              if (current) sections[current] += line + '\n';
            }

            const isEmpty = v => !v || !v.trim() || /^_No response_$/im.test(v.trim());
            const missing = REQUIRED[type].filter(name => {
              const key = Object.keys(sections).find(k => k.toLowerCase().startsWith(name.toLowerCase()));
              return !key || isEmpty(sections[key]);
            });

            const had = labels.includes(LABEL);
            const { owner, repo } = context.repo;
            const issue_number = issue.number;

            if (missing.length === 0) {
              if (had) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
              }
              return;
            }

            if (!had) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
              const list = missing.map(m => `- **${m}**`).join('\n');
              const extra = missing.some(m => m.startsWith('Acceptance command'))
                ? '\n\n> The acceptance command must be runnable as written (`pnpm test x.test.ts`), not a description. It is what lets verification block instead of merely advise.'
                : '';
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `This \`${type}\` ticket is missing:\n\n${list}\n\nAdd them and the label clears itself.${extra}`,
              });
            }
